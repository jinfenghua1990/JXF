<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>售后登记表</title>
<style>
/* 设计语言：冷灰蓝底 + 白卡片 + 蓝主色 + 深海军蓝侧栏 */
:root{
  --app-bg:#f5f7fb; --surface:#ffffff; --surface-muted:#f8fafc; --surface-soft:#eef2f7;
  --border:#e4e9f1; --border-strong:#ccd5e2;
  --text:#111827; --text-strong:#344054; --text-muted:#667085; --text-soft:#98a2b3;
  --accent:#2f6fed; --accent-hover:#245fd1; --accent-soft:#eef4ff;
  --success-soft:#ecfdf3; --success-text:#067647; --success-ring:#abefc6;
  --warning-soft:#fffaeb; --warning-text:#b54708; --warning-ring:#fedf89;
  --danger-soft:#fff1f3; --danger-text:#b42318; --danger-ring:#fecdca;
  --sky-soft:#f0f9ff; --sky-text:#026aa2; --sky-ring:#b9e6fe;
  --sidebar:#14263d; --sidebar-muted:#9fb0c6; --sidebar-active:#2f6fed;
  --table-head:#f7f9fc;
  --card-shadow:0 1px 2px rgb(16 24 40 / 4%);
  --focus-ring:rgb(47 111 237 / 22%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{height:100%}
body{background:var(--app-bg);color:var(--text);font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;height:100%;overflow:hidden}

/* ===== 侧栏 ===== */
.sidebar{width:196px;flex-shrink:0;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:15px 14px 13px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--sidebar-active);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.brand-name{font-size:13.5px;font-weight:600;letter-spacing:.2px}
.brand-sub{font-size:10px;color:var(--sidebar-muted);margin-top:1px}
.nav-group{padding:10px 10px 4px;font-size:10.5px;color:var(--sidebar-muted);letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:9px;margin:1px 8px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:#d5dfee;cursor:pointer;text-decoration:none;transition:background 120ms}
.nav-item:hover{background:rgb(255 255 255 / 7%)}
.nav-item.on{background:var(--sidebar-active);color:#fff;font-weight:500}
.nav-item .ico{width:15px;text-align:center;opacity:.85}
.nav-foot{margin-top:auto;padding:12px 14px;font-size:10.5px;color:var(--sidebar-muted);border-top:1px solid rgb(255 255 255 / 8%)}

/* ===== 主区 ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{position:sticky;top:0;z-index:20;flex-shrink:0;background:rgb(255 255 255 / 92%);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:9px 18px}
.topbar h1{font-size:14px;font-weight:600;color:var(--text)}
.topbar .crumb{font-size:11px;color:var(--text-soft)}
.top-month{display:flex;align-items:center;gap:6px;white-space:nowrap}
.top-month label{font-size:12px;color:var(--text-muted)}
.top-month .inp{width:132px}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:500;white-space:nowrap}
.b-green{background:var(--success-soft);color:var(--success-text);box-shadow:inset 0 0 0 1px var(--success-ring)}
.b-amber{background:var(--warning-soft);color:var(--warning-text);box-shadow:inset 0 0 0 1px var(--warning-ring)}
.b-red{background:var(--danger-soft);color:var(--danger-text);box-shadow:inset 0 0 0 1px var(--danger-ring)}
.b-sky{background:var(--sky-soft);color:var(--sky-text);box-shadow:inset 0 0 0 1px var(--sky-ring)}
.b-gray{background:var(--surface-soft);color:var(--text-muted);box-shadow:inset 0 0 0 1px var(--border)}
.content{padding:14px 18px 30px;width:100%;max-width:none;min-width:0}
/* 固定外壳：页面整体不滚动，只有表格主体区域滚动 */
#view-board{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding-bottom:14px}
#view-stats{flex:1;min-height:0;overflow:auto}

/* ===== 指标卡（MetricCard 风格） ===== */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px;margin-bottom:14px;flex-shrink:0}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--card-shadow)}
.metric .lb{font-size:11.5px;color:var(--text-muted)}
.metric .vl{font-size:20px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--text)}
.metric .vl .unit{font-size:11px;font-weight:400;color:var(--text-soft);margin-left:3px}
.metric .hint{font-size:10.5px;color:var(--text-soft);margin-top:3px}
.v-danger{color:var(--danger-text)}.v-success{color:var(--success-text)}.v-warn{color:var(--warning-text)}.v-accent{color:var(--accent)}

/* ===== 工具条 ===== */
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:11px;flex-shrink:0}
.tb-sep{width:1px;height:20px;background:var(--border-strong);margin:0 3px;display:inline-block;flex-shrink:0}
.tb-act{display:inline-flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer;color:var(--text-strong);transition:all 120ms}
.btn:hover{background:var(--surface-muted);border-color:var(--border-strong)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:7px}
.inp,select.inp{background:#fff;border:1px solid var(--border-strong);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;color:var(--text);transition:all 120ms}
.auto-field{background:var(--surface-soft);color:var(--text-muted);border-color:var(--border)}
.auto-field::placeholder{color:var(--text-soft)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring);outline:none}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);cursor:pointer}

/* ===== 表格卡片 ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--card-shadow);overflow:hidden;margin-bottom:13px}
.card-head{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-head b{font-size:12.5px;font-weight:600;color:var(--text-strong)}
.tablewrap{overflow-x:auto;overscroll-behavior-x:contain}
/* 表格卡片撑满剩余高度，只有表格主体（tbody）滚动，表头吸附 */
#t0card{flex:1;min-height:180px;display:flex;flex-direction:column;margin-bottom:0}
#t0{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
#dupAlert,#pageUpdateNotice{flex-shrink:0}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:var(--table-head);text-align:left;padding:8px 10px;font-weight:500;font-size:11.5px;color:var(--text-muted);white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
 #t0 th{position:sticky;cursor:grab;user-select:none}#t0 th.dragging{opacity:.45}#t0 th.drop-target{box-shadow:inset 3px 0 var(--accent)}
 #t0 th .col-resizer{position:absolute;right:-3px;top:0;width:8px;height:100%;cursor:col-resize;z-index:8;touch-action:none}
 #t0 th .col-resizer:hover,#t0 th .col-resizer.active{background:var(--accent);opacity:.35}
#t0 th.head-basic{background:#e8f0fc;color:#244b7c}
#t0 th.head-type{background:#eee6fa;color:#69419b}
#t0 th.head-money{background:#fff0d4;color:#8c550b}
#t0 th.head-progress{background:#e2f3ed;color:#21634b}
#t0 .table-group-row th{font-size:12px;font-weight:700;padding:7px 12px;border-right:3px solid white;cursor:default;top:0}
#t0 th[data-col]{top:30px;border-right:1px solid rgb(255 255 255 / 65%)}
#t0 td{overflow:hidden;text-overflow:ellipsis}
#t0 td .cell{box-sizing:border-box}
td{padding:0;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
td.t{padding:7px 10px}
tbody tr:hover{background:var(--surface-muted)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--text-strong)}
.cell{border:0;background:transparent;font:inherit;font-size:12px;padding:7px 10px;width:100%;min-width:44px;color:var(--text)}
.cell:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent);background:#fff;border-radius:4px}
td.num .cell{text-align:right;font-variant-numeric:tabular-nums}
.numtxt{text-align:right;font-variant-numeric:tabular-nums}
a.link{color:var(--accent);text-decoration:none;font-weight:500}
a.link:hover{text-decoration:underline}
.empty{padding:28px;text-align:center;color:var(--text-soft);font-size:12px}
.g2wrap{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:900px){.g2wrap{grid-template-columns:1fr}}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgb(16 24 40 / 34%);display:none;align-items:flex-start;justify-content:center;z-index:1000;padding:30px 16px;overflow:auto}
.mask.on{display:flex}
.duplicate-mask{z-index:1250}
.duplicate-modal{max-width:1280px}
.duplicate-modal .tablewrap{margin:12px 0}
.duplicate-modal td{padding:8px 10px;white-space:normal}
.duplicate-modal td .inp{width:100%;min-width:155px}
.duplicate-reason{width:100%;min-height:75px;resize:vertical}
.duplicate-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.duplicate-error{color:var(--danger-text);margin-top:8px;min-height:20px}
.modal{background:#fff;border-radius:14px;max-width:1280px;width:calc(100vw - 32px);max-height:92vh;overflow:auto;padding:18px 22px;box-shadow:0 12px 32px rgb(16 24 40 / 12%)}
.modal h2{font-size:14.5px;font-weight:600;margin-bottom:4px;color:var(--text)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px;margin-bottom:9px}
.lookup-section,.manual-section{border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin:10px 0}
.lookup-section{background:#eef6ff;border-color:#9ac7ff}
.lookup-section .section-label{color:#1759a6}
.auto-section{background:#f3f4f6;border:1px solid #d0d5dd;border-radius:8px;padding:9px 10px}
.auto-section .section-label{color:#667085}
.manual-section{background:#fff8ed;border-color:#f3d4a0}
.manual-section .section-label{color:#8a4b08}
.section-label{font-size:11.5px;font-weight:600;color:var(--text-strong);margin-bottom:8px}
.section-label span{font-size:10.5px;color:var(--text-soft);font-weight:400;margin-left:6px}
.lookup-row{grid-template-columns:repeat(2,minmax(220px,1fr));margin-bottom:0}
.auto-row{grid-template-columns:repeat(2,minmax(155px,1fr));margin-bottom:0}
.custom-duty{margin-top:7px}
.return-key-alert{margin-top:10px;padding:11px 13px;border:2px solid #f04438;border-radius:9px;background:#fff1f0;color:#b42318;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgb(180 35 24 / 12%)}
.return-key-alert small{display:block;margin-top:3px;font-size:11px;font-weight:400;color:#b42318}
.goods-panel{margin-top:10px;border-top:1px solid #c9d7ea;padding-top:8px}
.goods-panel-title{font-size:11.5px;font-weight:600;color:var(--text-strong);margin-bottom:5px}
.goods-panel table{font-size:11.5px;background:rgb(255 255 255 / 60%)}
.goods-panel th,.goods-panel td{padding:5px 7px;white-space:normal}
.fld label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:3px;font-weight:500}
.fld .inp{width:100%}
.sec{border-top:1px solid var(--border);padding-top:11px;margin-top:11px}
.sec h4{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text-strong);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,.75fr);gap:16px;align-items:start}
.detail-main{min-width:0}
.detail-group{border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:12px;background:#fff}
.detail-group.order-group{border-color:#b8d3fb;background:linear-gradient(180deg,#f7fbff 0%,#fff 22%)}
.detail-group.warehouse-group{border-color:#f1d19d;background:linear-gradient(180deg,#fffaf1 0%,#fff 24%)}
.detail-group.dispute-group{border-color:#d9c5f5;background:linear-gradient(180deg,#fbf8ff 0%,#fff 24%)}
.detail-group-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-strong);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid rgb(148 163 184 / 24%)}
.detail-group-title span{font-size:10.5px;font-weight:400;color:var(--text-muted)}
.detail-group-title .group-mark{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgb(51 94 234 / 12%)}
.warehouse-group .group-mark{background:#d97706;box-shadow:0 0 0 4px rgb(217 119 6 / 13%)}
.dispute-group .group-mark{background:#7f56d9;box-shadow:0 0 0 4px rgb(127 86 217 / 13%)}
.detail-group.money-group{background:#fffaf1;border-color:#efd3a0}
.money-group .group-mark{background:#cf8b1c}
.money-balance{display:flex;align-items:center;gap:8px;border-top:1px solid #ecdcc0;padding-top:10px;color:#7c5921;font-size:12px}.money-balance b{font-size:20px}.money-balance span{margin-left:auto;color:var(--text-muted)}
.detail-main .frow{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.detail-main .money-group .frow{grid-template-columns:repeat(4,minmax(0,1fr))}
.detail-main .fld .inp{box-sizing:border-box;min-width:0}
.detail-main textarea{resize:vertical;min-height:64px}
.evidence-side{position:static;background:#f8faff;padding:14px;box-shadow:none;min-width:0}
.responsibility-summary{border-left:4px solid #7f56d9;border-radius:8px;background:#f0eafb;padding:12px 14px;color:#593589;margin-bottom:16px}
.responsibility-summary span{display:block;font-size:11px}.responsibility-summary strong{display:block;font-size:20px;margin:4px 0}.responsibility-summary small{display:block;line-height:1.7;font-size:11px}
.evidence-title small{font-size:10px;font-weight:400;color:var(--text-muted);display:block;margin-top:4px}
.evidence-source-group{border:1px solid #d8e2ee;border-radius:9px;background:white;margin-bottom:10px;overflow:hidden}
.evidence-source-group h4{margin:0;padding:8px 10px;background:#edf2f9;font-size:12px;color:#35495f;display:flex;justify-content:space-between}.evidence-source-group h4 span{font-weight:400;color:#6e7e92}
.source-warehouse h4{background:#fff0d4;color:#8c550b}.source-merchant h4{background:#e8f0fc;color:#244b7c}
.evidence-empty{font-size:11px;color:var(--text-soft);margin:10px}
.evidence-file{padding:9px 10px;border-top:1px solid #eef1f5}
.evidence-file-link{border:0;background:none;text-align:left;font:inherit;font-size:12px;color:var(--accent);cursor:pointer;padding:0;overflow-wrap:anywhere;line-height:1.6}
.evidence-file-link:hover{text-decoration:underline}
.evidence-file-actions{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:6px}.evidence-file-actions select{font-size:10.5px;padding:3px 5px}
.evidence-source-label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px}
.evidence-side .upload-box>select{width:100%;margin-bottom:6px}.evidence-side .upload-box input[type=file]{width:100%;font-size:11px}
.evidence-hover{position:fixed;z-index:1900;pointer-events:none;background:#fff;border:1px solid #bfcde0;border-radius:10px;padding:8px;box-shadow:0 10px 40px rgb(16 24 40 / 22%);box-sizing:border-box;color:#667085;font-size:11px}
.evidence-hover[hidden]{display:none}.evidence-hover img{display:block;max-width:100%;width:auto;height:auto;max-height:min(270px,65vh);margin:auto;object-fit:contain}.evidence-hover>div{text-align:center;padding-top:5px}
.evidence-viewer{position:fixed;inset:0;z-index:2100;background:rgb(10 18 32 / 94%);display:flex;flex-direction:column}
.image-viewer-bar{display:flex;align-items:center;gap:8px;padding:12px 18px;background:#fff;flex-shrink:0}.image-viewer-bar span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.image-viewer-stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:18px}.image-viewer-stage img{max-width:100%;max-height:100%;object-fit:contain}
.evidence-viewer.actual-size .image-viewer-stage{display:block}.evidence-viewer.actual-size img{max-width:none;max-height:none}
@media(max-width:900px){.detail-main .money-group .frow{grid-template-columns:repeat(2,minmax(0,1fr))}.image-viewer-bar{flex-wrap:wrap}}
.modal.detail-dialog{max-width:1760px;width:calc(100vw - 32px);padding:16px 18px;max-height:94vh;overflow:hidden}
.detail-dialog h2{font-size:17px;margin:0 0 12px}
.detail-layout.three-columns{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);gap:14px;height:calc(94vh - 116px);align-items:stretch}
.detail-column{min-width:0;overflow:auto;padding:0 5px 10px 0;scrollbar-gutter:stable}
.detail-column-heading{position:sticky;top:0;z-index:8;padding:11px 12px;margin:0 0 10px;border-radius:9px;background:#e8f0fc;color:#244b7c;font-weight:700;font-size:14px;border:1px solid #bdd0eb}
.detail-column-heading small{font-size:10.5px;font-weight:400;display:block;margin-top:3px;color:inherit;opacity:.8}
.issue-column .detail-column-heading{background:#fff0d4;color:#8c550b;border-color:#ebcc94}
.responsibility-column .detail-column-heading{background:#eee6fa;color:#69419b;border-color:#d4bdeb}
.detail-column .frow{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.detail-column .money-group .frow{grid-template-columns:repeat(2,minmax(0,1fr))}
.detail-column .inp{box-sizing:border-box;min-width:0}
.detail-column textarea{resize:vertical;min-height:76px}
.detail-column .autofill{font-size:11px;line-height:1.7;overflow-wrap:anywhere}
.detail-column .autofill #liveSync{font-size:11px}
.issue-group{border-color:#efce98;background:#fffcf5}
.communication-block{margin-top:14px;padding-top:12px;border-top:1px solid #ded2ef}
.communication-block h4{font-size:13px;color:#593589;margin:0 0 8px}
.communication-log{max-height:240px;overflow:auto;margin-bottom:10px;display:grid;gap:7px}
.communication-entry{padding:9px 10px;border:1px solid #d4deef;border-left:3px solid #4d7cdc;background:#f4f8ff;border-radius:7px}
.communication-entry.warehouse{border-color:#eddbb5;border-left:3px solid #d69721;background:#fff9ec}
.communication-entry .who{font-size:10.5px;color:#68758b;margin-bottom:4px}.communication-entry .txt{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.communication-empty{font-size:11px;color:var(--text-soft);padding:9px;background:#f7f8fb;border-radius:7px}
.communication-compose{display:grid;grid-template-columns:1fr auto;gap:8px}.communication-compose textarea{grid-column:1 / -1;width:100%;box-sizing:border-box}.communication-compose .btn{justify-self:end}
.detail-footer{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.new-evidence-box{margin-top:14px;padding:12px;border:1px dashed #afbdd8;border-radius:10px;background:#f8faff}
.new-evidence-box h4{margin:0 0 7px;font-size:12px;color:var(--text-strong)}.new-evidence-box h4 span{font-size:11px;font-weight:400;color:var(--text-muted);margin-left:6px}
.new-evidence-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.new-evidence-controls input{max-width:100%}
.new-evidence-previews{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.new-evidence-item{width:134px;border:1px solid var(--border);border-radius:8px;padding:6px;background:#fff;box-sizing:border-box}
.new-evidence-item img{width:120px;height:76px;object-fit:contain;background:#eef2f8;cursor:zoom-in;border-radius:4px}
.new-evidence-item .name{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:5px 0}
.new-evidence-item .actions{display:flex;justify-content:space-between;align-items:center;font-size:10px}
@media(max-width:1100px){.modal.detail-dialog{overflow:auto}.detail-layout.three-columns{grid-template-columns:1fr;height:auto}.detail-column{overflow:visible}.detail-column-heading{position:static}}
.evidence-side{position:static;min-width:0;border:1px solid #c7d7f8;border-radius:12px;background:#f8faff;padding:14px;box-shadow:none}
.evidence-hero{border-radius:10px;padding:12px;color:#fff;background:linear-gradient(135deg,#335eea,#5b8def);box-shadow:0 4px 12px rgb(51 94 234 / 22%);margin-bottom:10px}
.evidence-hero.warehouse{background:linear-gradient(135deg,#b54708,#f79009)}
.evidence-hero.owner{background:linear-gradient(135deg,#6941c6,#9e77ed)}
.evidence-hero.buyer{background:linear-gradient(135deg,#087443,#32b583)}
.evidence-hero.pending{background:linear-gradient(135deg,#667085,#98a2b3)}
.evidence-hero .eyebrow{font-size:10px;opacity:.82;margin-bottom:5px}
.evidence-hero strong{font-size:19px;display:block;letter-spacing:.5px}
.evidence-hero small{display:block;margin-top:6px;line-height:1.55;opacity:.9}
.evidence-title{font-size:12px;font-weight:700;color:var(--text-strong);margin:10px 0 6px}
.evidence-plan{display:grid;gap:6px}
.evidence-plan div{display:flex;gap:7px;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px 8px;font-size:11.5px;color:var(--text)}
.evidence-plan b{color:var(--accent);font-size:12px}
.evidence-side .upload-box{background:#fff;border:1px dashed #9ab7f6;border-radius:8px;padding:9px;margin-top:9px}
.evidence-side .upload-box .inp{max-width:100%;box-sizing:border-box}
.evidence-side .file-list{margin-top:7px}
@media(max-width:900px){.detail-layout{grid-template-columns:1fr}.evidence-side{position:static}}
.reply{border-left:3px solid var(--border-strong);padding:7px 12px;margin-bottom:7px;border-radius:0 8px 8px 0;background:var(--surface-muted)}
.reply.warehouse{border-color:var(--accent)}
.reply.owner{border-color:#94a3b8}
.reply .who{font-size:10.5px;color:var(--text-soft);margin-bottom:1px}
.reply .txt{font-size:12px;white-space:normal;color:var(--text)}
.note{font-size:11px;color:var(--text-muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.7}
.alert{border-radius:10px;padding:9px 13px;font-size:12px;margin-bottom:11px}
.a-warn{background:var(--warning-soft);color:var(--warning-text)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 18px;border-radius:10px;font-size:12px;z-index:1100;display:none;box-shadow:0 8px 24px rgb(16 24 40 / 25%)}
.toast.on{display:block}
.autofill{background:var(--accent-soft);border:1px solid #c7d9fb;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:9px;line-height:1.8;color:var(--text-strong)}
.autofill b{color:var(--accent)}
@media(max-width:860px){.sidebar{display:none}.content{padding:12px}}

/* ===== 登录遮罩 ===== */
.login-mask{position:fixed;inset:0;background:var(--sidebar);display:none;align-items:center;justify-content:center;z-index:2000}
.login-card{background:#fff;border-radius:16px;padding:26px 24px;width:300px;box-shadow:0 16px 40px rgb(0 0 0 / 30%)}
.login-card .inp{font-size:13px;padding:9px 11px}
.login-card .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--sidebar-active);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px}

/* ===== 工单看板 ===== */
#wo-kpis .vl.pending{color:var(--warning-text)}
#wo-kpis .vl.proc{color:var(--sky-text)}
#wo-kpis .vl.done{color:var(--success-text)}
#wo-kpis .vl.over{color:var(--danger-text)}
.wo-role{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;flex-shrink:0}
.wo-role button{border:0;background:var(--surface);padding:5px 11px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--text-muted)}
.wo-role button+button{border-left:1px solid var(--border)}
.wo-role button.on{background:var(--accent);color:#fff}
.wo-pri{font-weight:500}
.wo-pri.p-high{color:var(--danger-text)}
.wo-pri.p-medium{color:var(--warning-text)}
.wo-pri.p-low{color:var(--text-muted)}
.wo-info{display:grid;grid-template-columns:84px 1fr;gap:7px 14px;font-size:12.5px;margin-bottom:6px}
.wo-info .l{color:var(--text-muted)}
.wo-tl{display:flex;flex-direction:column;margin-bottom:4px}
.wo-tl .it{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.wo-tl .it:last-child{border-bottom:0}
.wo-tl .dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);margin-top:5px}
.wo-tl .dot.bot_created{background:var(--accent)}
.wo-tl .dot.wecom_scan{background:var(--sky-text)}
.wo-tl .dot.ai_infer{background:var(--warning-text)}
.wo-tl .dot.manual{background:var(--success-text)}
.wo-tl .meta{font-size:11px;color:var(--text-soft)}
.wo-tl .ct{font-size:12.5px;color:var(--text);white-space:pre-wrap;margin-top:2px}
.wo-form{display:grid;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.wo-form label{font-size:11.5px;color:var(--text-muted);display:block;margin-bottom:4px}
.wo-form select,.wo-form input,.wo-form textarea{width:100%;box-sizing:border-box}
.wo-form textarea{font-family:inherit;resize:vertical}
.wo-close{position:absolute;top:12px;right:14px;border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--text-soft)}
.wo-close:hover{color:var(--text)}
</style>
</head>

 </div>

<script>
const PAGE_REVISION='__CLAIMS_PAGE_REVISION__';
const PAGE_ID=new URL(location.href).searchParams.get('_refresh_id')||(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
const $=id=>document.getElementById(id);
const v=id=>$(id).value;
const dtInput=v0=>{const s=String(v0||'').replace(' ','T');return s.length===10?s+'T00:00':s.slice(0,16)};
const dtText=v0=>String(v0||'').replace('T',' ').slice(0,16);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>parseFloat(x)||0;
const money=x=>num(x).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
let META=null,EV=[],CUR=null,busy=false,lastStats=null,VIEW='board';
let duplicateGroups=[],duplicateReviewBusy=false;

const ST_CLS={paid:'b-green',rejected:'b-red',gave_up:'b-gray',submitted:'b-amber',replying:'b-sky',draft:'b-gray'};
const DUTY_CLS={warehouse:'b-amber',express:'b-sky',shared:'b-amber',juxiaofan:'b-sky',buyer:'b-amber',custom:'b-gray',undecided:'b-gray'};
const stLb=s=>{const x=(META?.status||[]).find(y=>y.value===s);return x?x.label:s};
const dyLb=(d,custom='')=>{if(d==='custom'&&custom)return custom;const x=(META?.duty_party||[]).find(y=>y.value===d);return x?x.label:d};
const stTag=s=>`<span class="badge ${ST_CLS[s]||'b-gray'}">${stLb(s)}</span>`;
const dyTag=(d,custom='')=>`<span class="badge ${DUTY_CLS[d]||'b-gray'}">${esc(dyLb(d,custom))}</span>`;
function toggleCustomDuty(selectId,inputId){const s=$(selectId),i=$(inputId);if(!s||!i)return;i.style.display=s.value==='custom'?'block':'none';if(s.value!=='custom')i.value='';}
const TYPE_LB={damage:'破损',loss:'丢件',shortage:'漏发/错发',wrong:'错发（历史）',undelivered:'未派送/派送错误',other:'其他'};
const RETURN_CLS={received:'b-green',shipping:'b-sky',suspected:'b-amber'};
const returnTag=e=>{const r=e.return_detection||{};return r.state&&r.state!=='none'?`<span class="badge ${RETURN_CLS[r.state]||'b-gray'}" title="${esc(r.evidence||'')}" style="max-width:145px;overflow:hidden;text-overflow:ellipsis">${esc(r.label)}</span>`:'<span style="color:var(--text-soft)">—</span>'};

function ageCell(e){
  if(e.status!=='submitted'&&e.status!=='replying')return '<span style="color:var(--text-soft)">—</span>';
  const d=new Date(e.event_date);const t=new Date();const a=Math.floor((t-d)/86400000);
  const col=a>=15?'var(--danger-text)':a<=7?'var(--success-text)':'var(--warning-text)';
  return `<span style="color:${col}" title="在途 ${a} 天">${a}天</span>`;
}

function reloadPage(){const url=new URL(location.href);url.searchParams.set('_reload',Date.now());location.replace(url.href)}
async function reportPageReady(){
 const field=$('n_lno'),mask=$('mask');
 try{await api('/api/page-ready',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
  page_id:PAGE_ID,revision:PAGE_REVISION,
  columns_ready:document.querySelectorAll('#t0 .col-resizer').length===TABLE_COLUMNS.length,
  shipment_form_visible:!!(field&&field.placeholder==='输入发货运单号自动查询'&&mask.classList.contains('on')&&field.getBoundingClientRect().width>0)
 })})}catch(e){}
}
async function checkPageVersion(){
 try{const r=await fetch('/api/page-version',{cache:'no-store'});if(!r.ok)return;const latest=await r.json();
  if(latest.revision===PAGE_REVISION)return;
  if($('mask').classList.contains('on')||$('duplicateMask').classList.contains('on')||document.activeElement?.matches('input,textarea,select')){$('pageUpdateNotice').hidden=false;return}
  if(document.visibilityState==='visible')reloadPage();
 }catch(e){}
}
setInterval(checkPageVersion,15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkPageVersion()});

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)}
function authHeader(){const t=localStorage.getItem('claims_token');return t?{'Authorization':'Bearer '+t}:{}}
// 开发期免登录标记：/api/me 返回 dev_mode 时置位。此后即使偶发 401 也不再弹登录框，
// 否则开发中一次无关的 401 就会把登录界面重新拽出来（用户明确要求「登录界面关闭」）。
let DEV_MODE=false;
// 当前账号权限上下文（由 /api/me 填充）：角色定动作上限，渠道定可改字段。
// 默认给「最宽」权限，/me 回来后再收紧；真正的边界在后端，这里只负责界面别误导人。
let ME={email:'',role:'admin',role_label:'',channel:'',channel_label:'',is_admin:true,can_write:true,can_create:true,writable_fields:'*',dev_mode:false};
function canWrite(field){if(!ME.can_write)return false;return ME.writable_fields==='*'||(ME.writable_fields||[]).includes(field)}
function isChannel(c){return (ME.channel||'')===c}
// 表格列 → 后端字段名（用于把无权编辑的单元格置为只读）。
const COL_FIELD={date:'event_date',carrier:'ship_carrier',tracking:'ship_logistics_no',refund:'refund_amount',claim:'claim_amount',received:'received_amount'};
function lockCells(scope){
 if(!scope)return;
 scope.querySelectorAll('td[data-col] > input.cell').forEach(inp=>{
  const f=COL_FIELD[inp.closest('td').dataset.col];
  if(f&&!canWrite(f)){inp.readOnly=true;inp.title='该字段由其他渠道负责填写';inp.style.color='var(--text-muted)'}
 });
}
// 按角色/渠道显隐工具栏与导航：data-perm=create|write|admin。
function applyPermissions(){
 const show=(sel,on)=>{document.querySelectorAll(sel).forEach(el=>{el.style.display=on?'':'none'})};
 show("[data-perm='create']",ME.can_create!==false);
 show("[data-perm='write']",ME.can_write!==false);
 show("[data-perm='admin']",!!ME.is_admin);
 show("[data-perm='warehouse']",ME.channel==="warehouse"||!!ME.is_admin||!ME.channel);
 const chip=$('userChip');
 if(chip&&!ME.dev_mode){
  const parts=[ME.role_label].filter(Boolean);
  chip.textContent=ME.email+(parts.length?' · '+parts.join(' · '):'');
 }
 renderScope();
}
// 当前「视角」= 账号所属渠道。数据三方皆看全量，区别只在「能改哪些字段」，
// 所以把渠道显式顶在右上角，避免仓库/客服互相覆盖口径。
const SCOPE_HINT={
 warehouse:'仓库视角：只能修改「入库检测 / 责任判定 / 仓库工单号 / 实收金额 / 状态」。台账全量可见。',
 outsource:'外包客服视角：只能修改「售后原因与类型 / 售后内容 / 退款原因 / 沟通回复」。台账全量可见。',
 operations:'运营和客服视角：可登记新单，并修改全部业务字段（不含账号管理）。台账全量可见。',
};
function renderScope(){
 const el=$('viewScope');if(!el)return;
 const ch=ME.channel||'';
 el.textContent='视角 · '+(ch?(ME.channel_label||ch):'全部字段');

  localStorage.removeItem('claims_token');

async function downloadViaAuth(url,filename){
 try{
  const r=await fetch(url,{headers:authHeader()});
  if(!r.ok){toast('下载失败：HTTP '+r.status);return}
  const blob=await r.blob();
  const a=document.createElement('a');
  const cd=r.headers.get('content-disposition')||'';
  const star=cd.match(/filename\*=UTF-8''([^;]+)/i);
  const m=cd.match(/filename="?([^";]+)"?/);
  a.href=URL.createObjectURL(blob);
  a.download=filename||(star?decodeURIComponent(star[1]):(m?m[1]:'download'));
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
 }catch(err){toast('下载失败：'+err.message)}
}

function bindTableLayout(){
 const root=$('t0');if(root.dataset.layoutBound)return;root.dataset.layoutBound='1';
 root.addEventListener('pointerdown',e=>{
  const th=e.target.closest('th[data-col]');if(!th||e.target.closest('.col-resizer'))return;
  const from=th.dataset.col,startX=e.clientX,startY=e.clientY;let moved=false;
  th.classList.add('dragging');
  const move=ev=>{if(Math.abs(ev.clientX-startX)+Math.abs(ev.clientY-startY)>6)moved=true};
  const up=ev=>{
   window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);th.classList.remove('dragging');
   if(!moved)return;
   const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('#t0 th[data-col]');
   const to=target?.dataset.col;if(!to||to===from||columnGroup(to)!==columnGroup(from))return;
   const order=tableLayout.order.slice(),a=order.indexOf(from),b=order.indexOf(to);order.splice(a,1);order.splice(b,0,from);
   tableLayout.order=order;saveTableLayout();t0();
  };
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true});
 });
 root.addEventListener('pointerdown',e=>{
  const grip=e.target.closest('.col-resizer'),th=grip&&grip.closest('th[data-col]');if(!th)return;
  e.preventDefault();e.stopPropagation();grip.classList.add('active');const key=th.dataset.col,startX=e.clientX,startW=th.getBoundingClientRect().width;
  const move=ev=>{const width=Math.max(55,Math.round(startW+ev.clientX-startX));tableLayout.widths[key]=width;const col=root.querySelector(`col[data-col="${key}"]`);if(col)col.style.width=width+'px'};
  const up=()=>{grip.classList.remove('active');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);saveTableLayout()};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true});
 });
}

let lastLookupKey='',lookupVerifiedKey='',lookupTimer=null,lookupRetryTimer=null,lookupRetryCount=0,lookupSequence=0;
// 新登记表单：按渠道隐藏/禁用不归本渠道负责的字段（仓库赔付金额由运营填，责任方由仓库填）。
const NEW_FIELD={n_date:'event_date',n_tid:'wdt_tid',n_carrier:'ship_carrier',n_lno:'ship_logistics_no',n_shop:'shop_name',n_type:'incident_type',n_after_type:'after_sales_type',n_claim:'claim_amount',n_claim_txt:'customer_claim',n_duty:'duty_party',n_duty_custom:'duty_party_custom',n_status:'status',n_basis:'duty_basis'};
function applyNewPerms(){
 if(ME.writable_fields==='*')return;
 Object.entries(NEW_FIELD).forEach(([id,field])=>{
  const el=$(id);if(!el||canWrite(field))return;
  el.disabled=true;el.removeAttribute('required');el.setAttribute('aria-required','false');
  if(id==='n_claim'){el.placeholder='由运营和客服填写（本渠道不填）';el.value=''}
  const lbl=el.closest('.fld')&&el.closest('.fld').querySelector('label');
  if(lbl&&id==='n_claim')lbl.insertAdjacentHTML('beforeend',' <span style="color:var(--text-soft)">· 由运营填写</span>');
 });
}
function currentPrefillKey(){return v('n_tid').trim()+'|'+v('n_lno').trim()}
function invalidatePrefill(){lookupVerifiedKey='';const box=$('n_fill');if(box&&box.style.display!=='none'){box.style.color='var(--warning-text)';box.textContent='号码已变化，正在重新核验旺店通…'};const btn=$('n_lookup_btn');if(btn)btn.disabled=false}
function schedulePrefill(){
 clearTimeout(lookupTimer);
 const key=v('n_tid').trim()+'|'+v('n_lno').trim();
 if(!key.replace('|','')||key===lastLookupKey)return;
 lookupSequence++;clearTimeout(lookupRetryTimer);lookupRetryTimer=null;
 lookupRetryCount=0;
 lookupTimer=setTimeout(()=>{lastLookupKey=key;prefill(true)},600);
}
function scheduleLookupRetry(){
 if(lookupRetryTimer)return;
 lookupRetryCount++;
 const hint=$('n_lookup_hint');
 if(hint)hint.textContent=`旺店通暂未返回，第 ${lookupRetryCount} 次自动重试中（约30秒后）；查到前不能登记`;
 lookupRetryTimer=setTimeout(()=>{lookupRetryTimer=null;prefill(true)},30000);
}
async function prefill(silent=false){
 const tid=v('n_tid').trim(),lno=v('n_lno').trim(),sequence=++lookupSequence;
 if(!tid&&!lno)return toast('先填订单号或快递单号');
 lookupVerifiedKey='';
 const hint=$('n_lookup_hint');
 const btn=$('n_lookup_btn');if(btn)btn.disabled=true;
 if(hint)hint.textContent='正在识别旺店通订单/发货信息，查询完成前不能登记…';
 try{
  const params=new URLSearchParams({logistics_no:lno,src_tid:tid});
  const s=await api('/api/wdt/shipment?'+params);
  if(sequence!==lookupSequence||!$('n_tid')||!$('mask').classList.contains('on'))return;
  $('n_fill').style.display='block';
  if(s.ok){
   const info=s.shipment;
   if(info.source_tid)$('n_tid').value=info.source_tid;
   if(info.carrier)$('n_carrier').value=info.carrier;
   if(info.logistics_no)$('n_lno').value=info.logistics_no;
   if(info.shop_name)$('n_shop').value=info.shop_name;
   const rd=info.return_detection||{};
   if(rd.suggested_type&&$('n_after_type')&&!$('n_after_type').value)$('n_after_type').value=rd.suggested_type;
   updateNewReturnAlert();
   const returnAlert=rd.state&&rd.state!=='none'?`<div class="return-key-alert">⚠ ${esc(rd.label||'原单退回')}<small>${esc(rd.evidence||'旺店通已返回退回相关证据')}　登记前请重点核对退货入库情况</small></div>`:'';
   const goods=(info.goods_items||[]).map(x=>`<tr><td class="mono">${esc(x.barcode||'—')}</td><td>${esc(x.name||'—')}</td><td class="numtxt">${num(x.quantity)}</td><td class="numtxt">${money(x.amount)}</td></tr>`).join('');
   const goodsPanel=goods?`<div class="goods-panel"><div class="goods-panel-title">商品明细（旺店通发货）</div><table><thead><tr><th>条形码</th><th>名称</th><th style="text-align:right">发货数量</th><th style="text-align:right">发货金额</th></tr></thead><tbody>${goods}</tbody><tfoot><tr><td colspan="3" style="text-align:right;font-weight:600">总金额</td><td class="numtxt" style="font-weight:600">${money(info.goods_total_amount||0)}</td></tr></tfoot></table></div>`:'';
   $('n_fill').innerHTML=returnAlert+`已从旺店通带出：原始订单号 <b>${esc(info.source_tid||'未返回')}</b>｜店铺 <b>${esc(info.shop_name||'—')}</b>｜快递 ${esc(info.carrier||'—')} ${esc(info.logistics_no||lno)}${info.src_order_no?'｜系统订单 '+esc(info.src_order_no):''}${info.stockout_no?'｜出库单 '+esc(info.stockout_no):''}${info.warehouse_name?'｜仓库 '+esc(info.warehouse_name):''}`+goodsPanel;
   lookupRetryCount=0;clearTimeout(lookupRetryTimer);lookupRetryTimer=null;
   lastLookupKey=v('n_tid').trim()+'|'+v('n_lno').trim();
   lookupVerifiedKey=lastLookupKey;
   if(btn)btn.disabled=false;
   if(hint)hint.textContent='查询完成，订单和发货信息已回填';
  }else{
   if(btn)btn.disabled=false;

let detSyncTimer=null, detSyncRetryTimer=null, detSyncRetryCount=0, detSyncSeq=0;
function scheduleDetailSync(code){
  clearTimeout(detSyncTimer);
  const key=v('d_tid').trim()+'|'+v('d_lno').trim();
  if(!key.replace('|','')){const b=$('liveSync');if(b)b.textContent='';return;}
  detSyncTimer=setTimeout(()=>detailLookup(code),600);
}
async function detailLookup(code){
  const tid=v('d_tid').trim(),lno=v('d_lno').trim();const seq=++detSyncSeq;
  const box=$('liveSync');if(box){box.style.color='var(--accent)';box.textContent='⟳ 正在搜索旺店通订单/发货信息…';}
  try{
    const params=new URLSearchParams({logistics_no:lno,src_tid:tid});
    const s=await api('/api/wdt/shipment?'+params);
    if(seq!==detSyncSeq||!$('d_tid'))return;
    if(s.ok){
      const info=s.shipment;
      if(info.source_tid&&!$('d_tid').trim())$('d_tid').value=info.source_tid;
      if(info.logistics_no&&!$('d_lno').trim())$('d_lno').value=info.logistics_no;
      if(info.carrier&&!$('d_carrier').trim())$('d_carrier').value=info.carrier;
      if(box)box.innerHTML='已从旺店通带出：原始订单号 <b>'+esc(info.source_tid||'未返回')+'</b>｜店铺 <b>'+esc(info.shop_name||'—')+'</b>｜快递 '+esc(info.carrier||'—')+' '+esc(info.logistics_no||lno)+(info.src_order_no?'｜系统订单 '+esc(info.src_order_no):'')+(info.stockout_no?'｜出库单 '+esc(info.stockout_no):'')+(info.warehouse_name?'｜仓库 '+esc(info.warehouse_name):'');
      detSyncRetryCount=0;clearTimeout(detSyncRetryTimer);detSyncRetryTimer=null;
    }else{
      if(box){box.style.color='var(--text-muted)';box.textContent=s.message||'旺店通接口未返回匹配数据';}
      detailSyncRetry(code);
    }
  }catch(err){
    if(seq!==detSyncSeq||!$('d_tid'))return;
    if(box){box.style.color='var(--text-muted)';box.textContent='查询失败，稍后自动重试';}
    detailSyncRetry(code);
  }
}
function detailSyncRetry(code){
  if(detSyncRetryTimer||detSyncRetryCount>=6)return;
  detSyncRetryCount++;
  const box=$('liveSync');
  if(box)box.textContent='旺店通暂未返回，'+detSyncRetryCount+'/6 次自动重试中（约15秒后）';
  detSyncRetryTimer=setTimeout(()=>{detSyncRetryTimer=null;detailLookup(code)},15000);
}

// 详情弹层字段 → 后端字段名：按渠道把无权编辑的控件禁用（后端同样会拦，这里只做提示）。
const DETAIL_FIELD={d_date:'event_date',d_tid:'wdt_tid',d_carrier:'ship_carrier',d_lno:'ship_logistics_no',d_refund:'refund_amount',d_claim:'claim_amount',d_received:'received_amount',d_pref:'warehouse_ref',d_type:'incident_type',d_after_type:'after_sales_type',d_duty:'duty_party',d_duty_custom:'duty_party_custom',d_status:'status',d_claim_txt:'customer_claim',d_basis:'duty_basis'};
function applyDetailPerms(){
 const modal=$('modal');if(!modal)return;
 const saveBtn=modal.querySelector('.detail-footer .btn.pri');if(saveBtn&&!ME.can_write)saveBtn.style.display='none';
 const delBtn=modal.querySelector('.detail-footer .btn[onclick^="delEvent"]');if(delBtn&&!ME.is_admin)delBtn.style.display='none';
 const foot=modal.querySelector('.detail-footer');
 if(foot&&ME.can_write&&!foot.querySelector('.perm-note')){
  const note=document.createElement('span');note.className='perm-note';
  note.style.cssText='font-size:11px;color:var(--text-soft);margin-right:auto';
  note.textContent='当前账号：'+(ME.channel_label||'未分配渠道')+' · '+(ME.role_label||'')+'，只能修改本渠道负责的字段';
  foot.prepend(note);
 }
 modal.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{
  const f=DETAIL_FIELD[el.id];if(!f||canWrite(f))return;
  el.disabled=true;el.title='该字段由其他渠道负责填写，如需修改请转交对应渠道';
 });
 if(!ME.can_write){
  modal.querySelectorAll('button[onclick^="checkStockin"],button[onclick^="doUpload"],button[onclick^="addReply"]').forEach(b=>{b.disabled=true;b.title='只读账号不能提交修改'});
  // 只读账号连附件上传控件一起停用，避免「能选文件却传不上去」的错觉。
  modal.querySelectorAll('#up_source,#up_kind,#up_file,#r_src,#r_txt').forEach(el=>{el.disabled=true});
 }
 // 沟通来源按渠道限定：仓库只能记仓库回复，外包客服只能记商家说明。
 const src=$('r_src');
 if(src&&!ME.is_admin){
  if(isChannel('warehouse')){[...src.options].forEach(o=>{o.disabled=o.value!=='warehouse'});src.value='warehouse'}
  else if(isChannel('outsource')){[...src.options].forEach(o=>{o.disabled=o.value!=='owner'});src.value='owner'}
 }
}
let autoSyncing=false;async function autoLiveSync(code){
 if(autoSyncing)return;autoSyncing=true;
 const box=$('liveSync');
 if(box)box.textContent='⟳ 正在搜索旺店通订单/发货/退货信息…';
 try{
  const s=await api(`/api/events/${encodeURIComponent(code)}/sync-wdt`,{method:'POST'});
  if(!s.ok){
   SYNC_MSG=s.message||'旺店通接口未返回匹配的发货信息';
   if(box)box.style.color='var(--text-muted)';
  }else if(s.stage==='refund'){
   const e=s.event||{};
   SYNC_MSG=`已同步退款 ${s.refund_count||1} 笔：顾客已赔 ${money(e.refund_amount)}`
     +(e.return_logistics_no?`；退货物流 ${e.return_carrier||'—'} ${e.return_logistics_no}`:'；该单退款未退货（无退货物流）')
     +(e.return_goods_count&&Number(e.return_goods_count)?`，退 ${e.return_goods_count} 件`:'');
  }else{
   SYNC_MSG=s.message||'已获取发货信息';
  }
 }catch(err){SYNC_MSG='实时获取失败：'+err.message}
 finally{
  autoSyncing=false;
  if(CUR?.code===code&&$('mask').classList.contains('on'))await openDetail(code,true);
 }
}

/* 全局粘贴上传：详情打开时按 Ctrl+V，剪贴板截图直接传给当前事件 */
document.addEventListener('paste',async e=>{
 if($('n_evidence_file')&&$('mask').classList.contains('on')){
  const images=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/'));if(!images.length)return;e.preventDefault();
  const stamp=dtText(new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString()).replace(/[ :]/g,'-');
  queueNewEvidence(images.map((item,i)=>{const blob=item.getAsFile();return blob?new File([blob],'截图_'+stamp+'-'+i+'.'+(blob.type.split('/')[1]||'png'),{type:blob.type}):null}).filter(Boolean));return;
 }
 if(!CUR||!$('mask').classList.contains('on'))return; // 仅详情弹层打开时响应
 const items=[...(e.clipboardData?.items||[])];
 const img=items.find(i=>i.type.startsWith('image/'));
 if(!img)return;
 e.preventDefault();
 const blob=img.getAsFile();
 if(!blob)return toast('剪贴板里没有图片');
 const ext=(blob.type.split('/')[1]||'png').replace('jpeg','jpg');
 const name=`截图_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.${ext}`;
 toast('正在上传粘贴的截图…');
 try{
  await uploadBlob(CUR.code,blob,name,'screenshot');
  toast('截图已上传');
  await openDetail(CUR.code,true);await loadAll();
 }catch(err){toast('上传失败：'+err.message)}
});

  const c=await api('/api/wdt/backfill-returns/candidates?'+new URLSearchParams({month:month||''}));
  if(!c.total){toast('没有待补记录（已有退货单号的不会重复查）');return}
  if(!window.confirm(`共有 ${c.total} 条记录缺少退货物流/退货单号。\n将从旺店通逐条查询退款单（每批 15 条，可随时中止）。\n\n开始补取吗？`))return;

  const codes=c.codes||[];
  const BATCH=15;
  let filledCount=0,noRefundCount=0,errs=[],done=0,samples=[];
  for(let i=0;i<codes.length;i+=BATCH){
   const part=codes.slice(i,i+BATCH);
   toast(`正在补取 ${done}/${codes.length}…`);
   try{
    const r=await api('/api/wdt/backfill-returns',{method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({codes:part,dry_run:false})});
    filledCount+=r.filled||0;
    noRefundCount+=r.no_refund||0;
    errs=errs.concat(r.error_samples||[]);
    samples=samples.concat(r.samples||[]);
   }catch(err){errs.push({code:part[0],error:err.message})}
   done+=part.length;
   await new Promise(r=>setTimeout(r,250));
  }
  await loadAll();
  const preview=samples.slice(0,10).map(x=>`${x.code}　${x.return_carrier||'—'} ${x.return_logistics_no||''}`).join('\n');
  alert(`补取完成\n\n已补到退货信息：${filledCount} 条\n无退货单（未退货/未产生）：${noRefundCount} 条\n查询失败：${errs.length} 条\n\n${preview}${samples.length>10?'\n…':''}`);
 }catch(err){toast('补取失败：'+err.message)}
 finally{if(btn)btn.disabled=false}
}

   menu.insertAdjacentHTML('beforeend',sep);

 });

<div id="manualPendingMask" style="display:none;position:fixed;inset:0;background:#13213b88;z-index:3000;align-items:center;justify-content:center;padding:24px" role="dialog" aria-modal="true" aria-labelledby="manualPendingTitle">

<script>
let manualPendingRows=[],manualPendingShown=false;
function manualSourceHtml(e){return `<details style="margin:14px 0;padding:12px;border:1px solid #e3d3a7;border-radius:10px" ${e.manual_import?.amount_conflict?'open':''}><summary>原始台账来源 · ${(e.manual_import?.source_rows||[]).length} 行${e.manual_import?.amount_conflict?' · 金额存在冲突，须人工确认':''}</summary>${(e.manual_import?.source_rows||[]).map(r=>`<div style="padding:10px 0;border-bottom:1px solid #edf0f5"><b>原表第 ${esc(r.row)} 行</b> · ${esc(r.values?.['日期']||'')} · ${esc(r.values?.['售后类型']||'')} · 原填赔付金额：${esc(r.values?.['赔付金额']||'未填')}<p style="white-space:pre-wrap">${esc(r.values?.['售后内容']||'')}</p></div>`).join('')}</details>`}
async function refreshManualPending(){
 if(!ME.is_admin){$('manualImportAlert').innerHTML='';return}
 try{const r=await api('/api/manual-import/pending');manualPendingRows=r.rows;
 const count=r.rows.filter(e=>e.claim_amount_known===false).length;
 $('manualImportAlert').innerHTML=r.total?`<div class="alert a-warn">人工补录待补齐（全部月份）${r.total} 条${count?'，其中 '+count+' 条仓库赔付金额待补 / 冲突；金额汇总仅含已知金额':''}。<button class="btn sm" onclick="openManualPending()">查看并人工补齐</button></div>`:'';
 if(r.total&&!manualPendingShown&&!$('duplicateMask').classList.contains('on')){manualPendingShown=true;openManualPending()}
 }catch(err){$('manualImportAlert').textContent='人工补齐清单加载失败：'+err.message}

function closeManualPending(){$('manualPendingMask').style.display='none'}
function openManualPending(code){
 const e=code?manualPendingRows.find(x=>x.code===code):null;
 $('manualPendingMask').style.display='flex';
 if(e){
 const field=(k,label,value,type='text')=>`<label style="display:block">${k==='order_amount'?'订单金额（选填）':(k==='claim_amount'?'仓库赔付金额':label)+' * 必填'}<input class="inp" style="width:100%;margin-top:6px" id="mp_${k}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} value="${esc(value??'')}"></label>`;
 $('manualPendingBody').innerHTML=`<h2 id="manualPendingTitle">人工补齐 · ${esc(e.ship_logistics_no)}</h2><div class="alert a-warn">${esc(e.missing_fields.join('、'))}。人工填写不代表旺店通已核验。</div><p>原表第 ${esc((e.manual_import.source_rows||[]).map(x=>x.row).join('、'))} 行 · ${esc(e.event_date)}<br>${esc(e.customer_claim)}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">${field('wdt_tid','原始订单号',e.wdt_tid)}${field('shop_name','店铺名称',e.shop_name)}${field('ship_logistics_no','发货物流单号',e.ship_logistics_no)}${field('ship_carrier','发货快递公司',e.ship_carrier)}${field('claim_amount','仓库赔付金额（未确认请留空）',e.claim_amount_known===false?'':e.claim_amount,'number')}${field('order_amount','订单金额（未知请留空）',e.order_amount_known?e.order_amount:'','number')}</div><p>补齐依据 / 信息来源（保存必填）</p><textarea class="inp" style="width:100%" id="mp_reason" placeholder="例如：仓库提供的发货记录、店铺后台订单截图"></textarea><p style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="openManualPending()">返回清单</button><button class="btn" onclick="closeManualPending()">稍后处理</button><button class="btn" onclick="saveManualPending('${e.code}',true,this)">查询旺店通并补齐</button><button class="btn pri" onclick="saveManualPending('${e.code}',false,this)">保存人工补齐</button></p><div id="mp_error" style="color:#c43a22"></div>`;
 $('mp_reason').insertAdjacentHTML('beforebegin',manualSourceHtml(e));
 }else{
 $('manualPendingBody').innerHTML=`<h2 id="manualPendingTitle">导入完成 · 人工补齐清单</h2><p>这些记录已保留，不会因旺店通查不到而丢失。无需一次补完，关闭后可从工作台提醒重新打开。</p><div class="tablewrap"><table><thead><tr><th>原表行</th><th>售后日期</th><th>发货物流单号</th><th>需要补齐 / 核验</th><th></th></tr></thead><tbody>${manualPendingRows.map(e=>`<tr><td>${esc((e.manual_import.source_rows||[]).map(x=>x.row).join('、'))}</td><td>${esc(e.event_date)}</td><td>${esc(e.ship_logistics_no)}</td><td>${esc(e.missing_fields.join('、'))}</td><td><button class="btn sm" onclick="openManualPending('${e.code}')">补齐</button></td></tr>`).join('')||'<tr><td colspan="5">当前月份没有待补齐记录</td></tr>'}</tbody></table></div><p style="text-align:right"><button class="btn pri" onclick="closeManualPending()">知道了，稍后维护</button></p>`;
 }

async function saveManualPending(code,verify,button){
 const payload={verify};for(const key of ['wdt_tid','shop_name','ship_logistics_no','ship_carrier','claim_amount','order_amount','reason'])payload[key]=$('mp_'+key).value.trim();
 const required=verify?[['ship_logistics_no','发货物流单号'],['reason','补齐依据']]:[['wdt_tid','原始订单号'],['shop_name','店铺名称'],['ship_logistics_no','发货物流单号'],['ship_carrier','发货快递公司'],['claim_amount','仓库赔付金额'],['reason','补齐依据']];
 const missing=required.filter(([key])=>!payload[key]);
 if(missing.length){$('mp_error').textContent='未完整补齐，不能保存：'+missing.map(x=>x[1]).join('、');$('mp_'+missing[0][0]).focus();return}
 if(!verify&&!confirm('确认完整保存人工补齐信息？保存成功后，此条将从补齐清单移除；旺店通未核验状态会单独保留。'))return;
 button.disabled=true;try{const result=await api('/api/manual-import/'+encodeURIComponent(code)+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!result.completed)throw new Error('记录尚未完整补齐，请检查必填项');await loadAll();await refreshManualPending();if(manualPendingRows.length)openManualPending();else closeManualPending();toast('补齐完成，已从待补清单移除')}catch(err){$('mp_error').textContent=err.message;button.disabled=false}
}

const WO_CAT={return:'退货',exchange:'换货',missing:'漏发',damage:'破损',wrong:'错发',other:'其他'};
const WO_PRI={high:'高',medium:'中',low:'低'};
const WO_TL={bot_created:'机器人建单',wecom_scan:'群聊扫描',ai_infer:'AI 推断',manual:'人工'};
const WO_WH_CATS='damage,missing,exchange,wrong';
let WO_ROLE='ops',WO_ROWS=[];
const woFmt=s=>s?String(s).replace('T',' ').slice(0,16):'—';
const woStTag=s=>`<span class="badge ${WO_ST_CLS[s]||'b-gray'}">${WO_ST[s]||esc(s)}</span>`;
const woPriCls=p=>p==='high'?'p-high':p==='medium'?'p-medium':'p-low';
const woDash='<span style="color:var(--text-soft)">—</span>';
function woDebounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}

function woReadFilters(){
 const p={};
 const st=v('wo-status'),cat=v('wo-category'),pri=v('wo-priority'),owner=v('wo-owner').trim(),kw=v('wo-keyword').trim();
 if(st)p.status=st; if(cat)p.category=cat; if(pri)p.priority=pri; if(owner)p.owner=owner; if(kw)p.keyword=kw;
 if(WO_ROLE==='wh')p.category=WO_WH_CATS;
 return p;
}
async function woLoad(){
 const f=woReadFilters();
 const qs=Object.keys(f).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(f[k])).join('&');
 let list,stats;
 try{ [list,stats]=await Promise.all([api(WO_API+(qs?'?'+qs:'')),api(WO_API+'/stats')]); }
 catch(e){ toast('工单加载失败：'+e.message); return; }
 const s=(stats&&stats.stats)||{};
 document.querySelectorAll('#wo-kpis .vl').forEach(el=>{el.textContent=s[el.dataset.k]??0});
 WO_ROWS=(list&&list.rows)||[];
 $('wo-cnt').textContent='共 '+WO_ROWS.length+' 条';
 const hideOwner=WO_ROLE==='wh';
 const tb=$('wo-table');
 if(!WO_ROWS.length){ tb.innerHTML='<table><tbody><tr><td class="empty">暂无工单</td></tr></tbody></table>'; return; }
 tb.innerHTML='<table><thead><tr><th>工单号</th><th>客户</th><th>关联订单</th><th>分类</th><th>优先级</th><th>状态</th>'
  +(hideOwner?'':'<th>负责人</th>')+'<th>创建时间</th><th>对话</th></tr></thead><tbody>'
  +WO_ROWS.map(r=>'<tr data-id="'+r.id+'" style="cursor:pointer">'
   +'<td class="t"><span class="mono">'+esc(r.code)+'</span></td>'
   +'<td class="t">'+(esc(r.customer_name)||woDash)+'</td>'
   +'<td class="t">'+(esc(r.related_order_no)||woDash)+'</td>'
   +'<td class="t">'+esc(WO_CAT[r.category]||r.category)+'</td>'
   +'<td class="t wo-pri '+woPriCls(r.priority)+'">'+esc(WO_PRI[r.priority]||r.priority)+'</td>'
   +'<td class="t">'+woStTag(r.status)+'</td>'
   +(hideOwner?'':'<td class="t">'+(esc(r.owner)||woDash)+'</td>')
   +'<td class="t" style="color:var(--text-muted)">'+woFmt(r.created_at)+'</td>'
   +'<td class="t" style="color:var(--text-muted)">'+(r.timeline_count||0)+' 条</td></tr>').join('')
  +'</tbody></table>';
 tb.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>woOpenDetail(tr.dataset.id));
}

async function woOpenDetail(id){
 let d; try{ d=await api(WO_API+'/'+id); }catch(e){ toast('工单不存在：'+e.message); return; }
 const o=d.order,isWh=WO_ROLE==='wh';
 const tl=(o.timelines||[]).map(t=>'<div class="it"><div class="dot '+esc(t.source)+'"></div><div>'
   +'<div class="meta">'+(esc(t.author)||'系统')+' · '+esc(WO_TL[t.source]||t.source)+' · '+woFmt(t.created_at)+'</div>'
   +'<div class="ct">'+esc(t.content)+'</div></div></div>').join('');
 const stOpts=Object.keys(WO_ST).map(k=>'<option value="'+k+'" '+(k===o.status?'selected':'')+'>'+WO_ST[k]+'</option>').join('');
 const priOpts=Object.keys(WO_PRI).map(k=>'<option value="'+k+'" '+(k===o.priority?'selected':'')+'>'+WO_PRI[k]+'</option>').join('');
 const form=isWh
  ? '<div class="wo-form"><div><label>处理状态</label><select class="inp" id="wo-f-status">'+stOpts+'</select></div>'
   +'<div style="font-size:11px;color:var(--text-soft)">仓库端仅可更新处理状态（如「已补发」「已换货」）；负责人与内部备注不可见。</div>'
   +'<div><button class="btn pri" style="width:100%;justify-content:center" onclick="woSave('+o.id+')">仓库更新状态</button></div></div>'
  : '<div class="wo-form">'
   +'<div><label>处理状态</label><select class="inp" id="wo-f-status">'+stOpts+'</select></div>'
   +'<div><label>优先级</label><select class="inp" id="wo-f-priority">'+priOpts+'</select></div>'
   +'<div><label>负责人</label><input class="inp" id="wo-f-owner" value="'+esc(o.owner)+'" placeholder="分配负责人"></div>'
   +'<div><label>追加处理记录（写入时间线）</label><textarea class="inp" id="wo-f-note" rows="3" placeholder="例如：已联系客户，等仓库补发"></textarea></div>'
   +'<div><button class="btn pri" style="width:100%;justify-content:center" onclick="woSave('+o.id+')">保存</button></div></div>';
 $('modal').innerHTML='<button class="wo-close" onclick="closeM()" title="关闭">×</button>'
  +'<div style="max-width:96vw">'
  +'<div style="font-size:15px;font-weight:600;margin-bottom:12px">'+esc(o.code)
  +' <span style="font-size:12px;font-weight:400;color:var(--text-muted)">'+esc(WO_CAT[o.category]||o.category)+' · 优先级 '+esc(WO_PRI[o.priority]||o.priority)+'</span></div>'
  +'<div class="wo-info">'
  +'<div class="l">客户</div><div>'+(esc(o.customer_name)||'—')+'</div>'
  +'<div class="l">关联订单</div><div class="mono">'+(esc(o.related_order_no)||'—')+'</div>'
  +'<div class="l">渠道</div><div>'+(esc(o.channel)||'—')+'</div>'
  +'<div class="l">状态</div><div>'+woStTag(o.status)+' <span style="color:var(--text-muted)">'+esc(o.status_label||'')+'</span></div>'
  +(isWh?'':'<div class="l">负责人</div><div>'+(esc(o.owner)||'—')+'</div>')
  +'<div class="l">摘要</div><div>'+esc(o.summary||'—')+'</div>'
  +'<div class="l">创建时间</div><div>'+woFmt(o.created_at)+'</div>'
  +'</div>'
  +'<div style="font-size:12.5px;font-weight:600;margin:14px 0 2px">对话时间线</div>'
  +'<div class="wo-tl">'+(tl||'<div style="color:var(--text-soft);font-size:12px;padding:8px 0">暂无记录</div>')+'</div>'
  +form+'</div>';
 $('mask').classList.add('on');
}

async function woSave(id){
 const body={status:$('wo-f-status').value};
 if(WO_ROLE!=='wh'){
  body.priority=$('wo-f-priority').value;
  body.owner=$('wo-f-owner').value.trim();
  body.note=$('wo-f-note').value.trim();
 }
 try{
  await api(WO_API+'/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  closeM(); toast('已保存'); woLoad();
 }catch(e){ toast('保存失败：'+e.message); }
}

function woExportCsv(){
 if(!WO_ROWS.length){ toast('暂无数据'); return; }
 const head=['工单号','客户','关联订单','分类','优先级','状态','负责人','创建时间','对话条数'];
 const rows=WO_ROWS.map(r=>[r.code,r.customer_name,r.related_order_no,WO_CAT[r.category]||r.category,WO_PRI[r.priority]||r.priority,WO_ST[r.status]||r.status,r.owner,r.created_at,r.timeline_count]);
 const csv='\uFEFF'+[head].concat(rows).map(a=>a.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download='work_orders_'+new Date().toISOString().slice(0,10)+'.csv';
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

(function woBind(){
 const box=$('wo-role');
 if(!box)return;
 box.onclick=e=>{
  const b=e.target.closest('button[data-r]'); if(!b)return;
  WO_ROLE=b.dataset.r;
  [].forEach.call(box.children,x=>x.classList.toggle('on',x===b));
  $('wo-category').disabled=WO_ROLE==='wh';
  $('wo-owner').style.display=WO_ROLE==='wh'?'none':'';
  woLoad();
 };
 ['wo-status','wo-category','wo-priority'].forEach(id=>$(id).addEventListener('change',woLoad));
 $('wo-owner').addEventListener('input',woDebounce(woLoad,350));
 $('wo-keyword').addEventListener('input',woDebounce(woLoad,350));
})();
</script>
</body>
</html>
